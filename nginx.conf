worker_processes 1;
error_log logs/error.log info;
pid /infocodes/var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    #log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    #                 '$status $body_bytes_sent "$http_referer" '
    #                 '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    proxy_cache_path /infocodes/var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Upstream para FastAPI backend
    upstream fastapi_backend {
        server localhost:8000;
    }

    # Upstream para Dashboard de Gestión de Problemas (Next.js, gestionado con pm2)
    upstream gestion_problemas_backend {
        server localhost:3001;
    }

    server {
        listen 8081 default_server;
        server_name 10.132.68.85 infocodes.si.orange.es;
        access_log /infocodes/var/log/nginx/infocodes.access.log;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static {
            alias /infocodes/project/dashboardsonar-application-python/infocodest/static;
        }

        location /dashboards {
            alias /infocodes/project/release-dashboard-application/dashboards;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Dashboard de Gestión de Problemas (Next.js con basePath=/problemas,
        # arrancado con pm2 en el puerto 3001). Sin barra final en proxy_pass:
        # nginx reenvía la URI completa (incluido /problemas) tal cual, que es
        # lo que Next.js espera al tener basePath configurado.
        location /problemas {
            proxy_pass http://gestion_problemas_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para API Epsilon Resumen IA (evita CORS y previene saturación con caché compartida)
        location /api/epsilon/ {
            proxy_pass https://soptmc.si.orange.es/MonTMC/api/epsilon/;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host soptmc.si.orange.es;
            proxy_connect_timeout 15s;
            proxy_read_timeout 30s;

            # Caché compartida para no saturar la API de Epsilon IA
            proxy_cache my_cache;
            proxy_cache_valid 200 15m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ==============================================================================
        # Inclusión Modular de Aplicaciones (conf.d)
        # Cada repositorio hermano gestiona su propio archivo en conf.d/:
        # - cso-incident.conf (/reportes-incidencias/ y /api -> FastAPI :8000)
        # ==============================================================================
        include /infocodes/nginx/conf/conf.d/*.conf;

        location / {
            include proxy_params;
            proxy_pass http://unix:/infocodes/var/run/infocodes.sock;
            proxy_cache my_cache;
        }

        location /data {
            alias /infocodes/project/release-dashboard-application/data;
            autoindex off;
        }
    }

    # HTTPS server
    #
    #server {
    #    listen 443 ssl;
    #    server_name localhost;

    #    ssl_certificate cert.pem;
    #    ssl_certificate_key cert.key;

    #    ssl_session_cache shared:SSL:1m;
    #    ssl_session_timeout 5m;

    #    ssl_ciphers HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers on;

    #    location / {
    #        root html;
    #        index index.html index.htm;
    #    }
    #}
}
