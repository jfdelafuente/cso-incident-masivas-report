# ==============================================================================
# Configuración Modular Nginx - CSO Incident Masivas Report
# Ubicación en servidor: /infocodes/nginx/conf/conf.d/cso-incident.conf
#
# Se incluye dentro del bloque 'server { ... }' principal de Nginx mediante:
#     include /infocodes/nginx/conf/conf.d/*.conf;
#
# De este modo, cada repositorio gestiona exclusivamente sus propias rutas
# sin sobrescribir ni interferir con las rutas de las demás aplicaciones
# (/problemas, /dashboards, /data, /static, etc.).
# ==============================================================================

# Redirección de compatibilidad al nuevo frontend en Release Dashboard
location /reportes-incidencias {
    return 301 /dashboards/reportes-incidencias/;
}

# API backend - FastAPI (proxy_pass al upstream fastapi_backend en puerto 8000)
location /api {
    proxy_pass http://fastapi_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts holgados para subida de CSVs grandes y generación de informes PPTX
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

